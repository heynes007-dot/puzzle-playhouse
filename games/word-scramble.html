<style>
/* Game-specific styling */
.game-wrapper {
    max-width: 700px;
    margin: 60px auto;
    text-align: center;
    padding: 30px;
  }

  .scramble {
    font-size: 2.5rem;
    letter-spacing: 6px;
    margin-bottom: 20px;
    color: #ffd700;
  }

  input {
    padding: 12px;
    width: 80%;
    font-size: 1.2rem;
    margin-bottom: 20px;
    border-radius: 5px;
    border: none;
  }

  button {
    padding: 12px 25px;
    font-size: 1.2rem;
    background: #ffd700;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  button:hover {
    background: #ffea6e;
  }

  .message {
    margin-top: 20px;
    font-size: 1.3rem;
  }
</style>
</head>

<body>
<!-- HEADER -->
<header class="site-header" role="banner">
  <div class="container">
    <a href="/puzzle-playhouse/index.html" class="logo" aria-label="Home">
      <div class="logo-mark">PP</div>
      <div class="logo-text">
        <div class="logo-title">Puzzle Playhouse</div>
        <div class="logo-sub">Books & Puzzles</div>
      </div>
    </a>

    <nav class="primary-nav" role="navigation" aria-label="Primary">
      <ul class="nav-list">
        <li><a href="/puzzle-playhouse/JournalBlog/PersonalGrowthHub.html">Personal Growth</a></li>
        <li><a href="/puzzle-playhouse/blog.html">Blog</a></li>
        <li><a href="/puzzle-playhouse/About.html">About</a></li>
        <li><a href="/puzzle-playhouse/contact.html">Contact</a></li>
        <li><a href="/puzzle-playhouse/index.html">Home</a></li>
      </ul>

      <div class="cta">
        <a class="btn" href="/puzzle-playhouse/sign_up.html">Sign up</a>
        <a class="btn primary" href="https://www.amazon.co.uk/stores/Andrew-Heynes/author/B0FD8NRPZJ?ref=ap_rdr&shoppingPortalEnabled=true">Shop Now</a>
      </div>
    </nav>
  </div>
</header>

<!-- GAME SECTION -->
<div class="game-wrapper">
  <h1>Word Scramble Game</h1>
  <p>Unscramble the word below:</p>

  <div class="scramble" id="scrambledWord">Loading...</div>

  <input type="text" id="userGuess" placeholder="Type your answer...">

  <button onclick="checkAnswer()">Submit</button>

  <div class="message" id="message"></div>
</div>

<!-- GAME SCRIPT -->
<script>
  const words = [
    "puzzle", "playhouse", "challenge", "creative", "logic",
    "christmas", "halloween", "valentine", "winter", "summer",
    "journal", "notebook", "activity", "brain", "scramble"
  ];

  let currentWord = "";

  function scrambleWord(word) {
    return word.split("").sort(() => Math.random() - 0.5).join("");
  }

  function newPuzzle() {
    currentWord = words[Math.floor(Math.random() * words.length)];
    document.getElementById("scrambledWord").textContent = scrambleWord(currentWord);
    document.getElementById("message").textContent = "";
    document.getElementById("userGuess").value = "";
  }

  function checkAnswer() {
    const guess = document.getElementById("userGuess").value.toLowerCase();

    if (guess === currentWord) {
      document.getElementById("message").textContent = "Correct! Generating a new puzzle...";
      setTimeout(newPuzzle, 1500);
    } else {
      document.getElementById("message").textContent = "Try again!";
    }
  }

  newPuzzle();
</script>

</body>
</html>
